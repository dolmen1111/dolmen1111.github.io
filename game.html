<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOLMEN | Torre Megalítica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 60px 24px 28px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b8b8b8;
    }

    /* Barra superior técnica con alta legibilidad */
    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background-color: #080808;
      border: 1px solid #262626;
      border-bottom: 0;
      padding: 13px 16px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13.5px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #c2c2c2;
    }

    .hud-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .hud-stats strong {
      color: #ffffff;
      font-weight: 700;
    }

    .sound-btn {
      background: transparent;
      border: 1px solid #3d3d3d;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sound-btn:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    /* Visor Monocromo 1-Bit */
    .canvas-frame {
      position: relative;
      width: 100%;
      background-color: #000000;
      border: 1px solid #262626;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }

    /* Pie de control bajo el visor */
    .game-caption {
      background-color: #080808;
      border: 1px solid #262626;
      border-top: 0;
      padding: 15px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      font-size: 14.5px;
      line-height: 1.45;
      color: #e8e8e8;
    }

    .action-pill {
      background-color: #ffffff;
      color: #000000;
      border: 0;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }

    .action-pill:hover {
      background-color: #d4d4d4;
    }

    /* Pie institucional idéntico a transparencia.html */
    footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #161616;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #777777;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      padding: 6px;
    }

    .footer-link:hover {
      color: #ffffff;
      transform: translateY(-1px);
    }

    .footer-link svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 36px 18px 24px;
      }
      .game-hud {
        font-size: 12px;
        padding: 10px 12px;
      }
      .hud-stats {
        gap: 12px;
      }
      .game-caption {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        gap: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1>DOLMEN</h1>
      <div class="subtitle">Ensayo de gravedad y apilamiento · Monocromo</div>
    </header>

    <div class="game-hud">
      <div class="hud-stats">
        <span>NIVEL: <strong id="hud-level">01</strong></span>
        <span>VIENTO: <strong id="hud-wind">0 KT</strong></span>
        <span>RÉCORD: <strong id="hud-best">00</strong></span>
      </div>
      <button type="button" class="sound-btn" id="sound-toggle">AUDIO: OFF</button>
    </div>

    <div class="canvas-frame">
      <canvas id="mono-canvas" width="256" height="192"></canvas>
    </div>

    <div class="game-caption">
      <span id="status-text">Asentá la columna izquierda sobre la base.</span>
      <button type="button" class="action-pill" id="action-btn">Soltar piedra</button>
    </div>

    <footer>
      <!-- Home -->
      <a class="footer-link" href="/" aria-label="Inicio">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 12 15 12 15 21"/>
        </svg>
      </a>

      <!-- Instagram -->
      <a class="footer-link" href="https://instagram.com/_dolmen" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </a>

      <!-- LinkedIn -->
      <a class="footer-link" href="https://www.linkedin.com/company/dolmen-arquitectura" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </a>

      <!-- Email -->
      <a class="footer-link" href="mailto:dolmen.arquitectura@proton.me" aria-label="Email">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </a>
    </footer>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById('mono-canvas');
      const ctx = canvas.getContext('2d');
      const W = 256;
      const H = 192;
      const groundY = 166;

      const hudLevel = document.getElementById('hud-level');
      const hudWind = document.getElementById('hud-wind');
      const hudBest = document.getElementById('hud-best');
      const statusText = document.getElementById('status-text');
      const actionBtn = document.getElementById('action-btn');
      const soundToggle = document.getElementById('sound-toggle');

      // Audio sintetizado seco
      let audioCtx = null;
      let soundOn = false;

      function tone(freq, dur, type = 'square', vol = 0.035) {
        if (!soundOn) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch (e) {}
      }

      soundToggle.addEventListener('click', () => {
        soundOn = !soundOn;
        soundToggle.textContent = soundOn ? 'AUDIO: ON' : 'AUDIO: OFF';
        if (soundOn) tone(600, 0.06);
      });

      // Partículas ambientales y polvo de impacto
      let windParticles = Array.from({ length: 20 }, (_, i) => ({
        x: (i * 39) % W,
        y: 18 + ((i * 31) % 136),
        speed: 0.6 + (i % 4) * 0.35
      }));
      let debris = [];

      // Estado general de la torre
      let level = 1;
      let best = parseInt(localStorage.getItem('dolmen_tower_best') || '0', 10);
      // Estados: SWING -> DROP -> SETTLE -> FAIL
      let state = 'SWING';
      // Sub-paso dentro de cada nivel: 0 = col izquierda, 1 = col derecha, 2 = techo
      let step = 0;

      let tick = 0;
      let shake = 0;
      let settleTimer = 0;
      let cameraY = 0;
      let targetCameraY = 0;

      // Variables físicas
      let wind = 0;
      let swingPhase = 0;
      let swingFreq = 0.032;

      // Historial de bloques asentados (en coordenadas del mundo donde groundY es 166)
      let settledBlocks = []; // {x, y, w, h, seed}
      // Superficie de apoyo actual {x, w, y}
      let currentBase = { x: 16, w: W - 32, y: groundY };
      // Piezas del nivel en curso
      let curColLeft = null;
      let curColRight = null;
      let activePiece = null; // {x, y, w, h, vx, vy, angle, angVel, kind}

      function spawnDust(x, y, count) {
        for (let i = 0; i < count; i++) {
          debris.push({
            x: x + (Math.random() - 0.5) * 14,
            y: y,
            vx: (Math.random() - 0.5) * 2.2,
            vy: -Math.random() * 2.1 - 0.4,
            life: 16 + Math.floor(Math.random() * 14)
          });
        }
      }

      function resetGame() {
        level = 1;
        settledBlocks = [];
        debris = [];
        cameraY = 0;
        targetCameraY = 0;
        currentBase = { x: 24, w: W - 48, y: groundY };
        startLevel(1);
      }

      function startLevel(lvl) {
        level = lvl;
        step = 0;
        curColLeft = null;
        curColRight = null;

        // Viento aleatorio creciente con la altura
        if (lvl === 1) {
          wind = 0;
        } else {
          const dir = Math.random() < 0.5 ? -1 : 1;
          const mag = (0.011 + Math.random() * 0.02) * Math.min(3.2, 0.65 + lvl * 0.22);
          wind = dir * mag;
        }

        // Ajustar cámara para mantener el nivel activo en la zona cómoda de visión
        const desiredTopY = currentBase.y - 125;
        targetCameraY = Math.min(0, desiredTopY);

        updateHUD();
        spawnNextPiece();
      }

      function spawnNextPiece() {
        swingPhase = Math.random() * Math.PI * 2;
        swingFreq = Math.min(0.078, 0.03 + level * 0.0042 + step * 0.003);

        const colH = Math.max(26, 38 - Math.floor(level / 3));
        const colW = Math.max(10, 14 - Math.floor(level / 4));
        const spawnY = targetCameraY + 22;

        if (step === 0) {
          // Columna izquierda
          activePiece = {
            kind: 'COL_L',
            x: currentBase.x,
            y: spawnY,
            w: colW,
            h: colH,
            vx: 0,
            vy: 0,
            angle: 0,
            angVel: 0,
            seed: level * 10 + 1
          };
          state = 'SWING';
          statusText.textContent = level === 1
            ? 'Nivel 1: Asentá la columna izquierda sobre el terreno.'
            : `Nivel ${level}: Apoyá la columna izquierda sobre el techo anterior.`;
          actionBtn.textContent = 'Soltar columna';
        } else if (step === 1) {
          // Columna derecha
          activePiece = {
            kind: 'COL_R',
            x: currentBase.x + currentBase.w - colW,
            y: spawnY,
            w: colW,
            h: colH,
            vx: 0,
            vy: 0,
            angle: 0,
            angVel: 0,
            seed: level * 10 + 2
          };
          state = 'SWING';
          statusText.textContent = 'Asentá la columna derecha dejando luz para el pórtico.';
          actionBtn.textContent = 'Soltar columna';
        } else if (step === 2) {
          // Techo (dintel) proporcional a la luz lograda
          const span = Math.abs(curColRight.x - curColLeft.x) + curColLeft.w;
          const roofW = Math.min(W - 24, Math.max(46, span + Math.max(12, 22 - level)));
          const roofH = Math.max(11, 14 - Math.floor(level / 5));
          activePiece = {
            kind: 'ROOF',
            x: 40,
            y: spawnY,
            w: roofW,
            h: roofH,
            vx: 0,
            vy: 0,
            angle: 0,
            angVel: 0,
            seed: level * 10 + 3
          };
          state = 'SWING';
          statusText.textContent = 'Coroná el pórtico con la losa superior.';
          actionBtn.textContent = 'Soltar techo';
        }
      }

      function updateHUD() {
        hudLevel.textContent = String(level).padStart(2, '0');
        hudBest.textContent = String(best).padStart(2, '0');
        const knots = Math.round(Math.abs(wind) * 420);
        const arrow = wind === 0 ? '' : (wind > 0 ? ' →' : ' ←');
        hudWind.textContent = `${knots} KT${arrow}`;
      }

      function triggerAction() {
        if (state === 'SWING' && activePiece) {
          state = 'DROP';
          activePiece.vy = 1.4;
          activePiece.vx = Math.cos(swingPhase) * (0.45 + level * 0.05);
          tone(step === 2 ? 360 : 280, 0.07, 'triangle');
          statusText.textContent = 'Descendiendo...';
        } else if (state === 'FAIL') {
          resetGame();
        }
      }

      canvas.addEventListener('click', triggerAction);
      actionBtn.addEventListener('click', triggerAction);
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          triggerAction();
        }
      });

      function failStructure(reason) {
        state = 'FAIL';
        const dir = activePiece && activePiece.x < W / 2 ? -1 : 1;
        if (activePiece) {
          activePiece.angVel = dir * 0.07;
          activePiece.vx = dir * 1.2;
          activePiece.vy = 0.8;
        }
        tone(98, 0.38, 'sawtooth', 0.06);
        statusText.textContent = reason;
        actionBtn.textContent = 'Volver a empezar';
      }

      function update() {
        tick++;
        if (shake > 0) shake--;

        // Interpolación suave de cámara vertical al subir pisos
        cameraY += (targetCameraY - cameraY) * 0.08;

        // Viento ambiental
        const windSpeed = wind === 0 ? 0.25 : wind * 46;
        windParticles.forEach((p) => {
          p.x += windSpeed * p.speed;
          if (p.x > W) p.x = 0;
          if (p.x < 0) p.x = W;
        });

        // Polvo
        debris.forEach((d) => {
          d.x += d.vx;
          d.y += d.vy;
          d.vy += 0.14;
          d.life--;
        });
        debris = debris.filter((d) => d.life > 0);

        if (state === 'SWING' && activePiece) {
          swingPhase += swingFreq;
          let minX = 12;
          let maxX = W - activePiece.w - 12;

          // En niveles altos, acotar ligeramente la carrera alrededor de la base actual
          if (level > 1 && step < 2) {
            minX = Math.max(8, currentBase.x - 28);
            maxX = Math.min(W - activePiece.w - 8, currentBase.x + currentBase.w + 28 - activePiece.w);
          }

          const mid = (minX + maxX) / 2;
          const amp = Math.max(10, (maxX - minX) / 2);
          activePiece.x = mid + Math.sin(swingPhase) * amp;
        } else if (state === 'DROP' && activePiece) {
          activePiece.vy += 0.23;
          activePiece.vx += wind;
          activePiece.y += activePiece.vy;
          activePiece.x += activePiece.vx;

          // Paso 0 o 1: Asentar columna sobre currentBase
          if (step === 0 || step === 1) {
            if (activePiece.y + activePiece.h >= currentBase.y) {
              const pCenter = activePiece.x + activePiece.w / 2;
              const baseLeft = currentBase.x;
              const baseRight = currentBase.x + currentBase.w;

              // Verificar si la columna apoya dentro de la base (tierra o techo inferior)
              if (pCenter < baseLeft + 2 || pCenter > baseRight - 2) {
                activePiece.y = currentBase.y;
                shake = 5;
                failStructure('La columna cayó fuera de la superficie de apoyo.');
                return;
              }

              // Si es la segunda columna, verificar que no choque con la primera ni quede demasiado lejos
              if (step === 1) {
                const dist = Math.abs(activePiece.x - curColLeft.x);
                if (dist < curColLeft.w + 6) {
                  activePiece.y = currentBase.y - activePiece.h;
                  failStructure('Columnas superpuestas: no queda luz entre apoyos.');
                  return;
                }
                if (dist > 118) {
                  activePiece.y = currentBase.y - activePiece.h;
                  failStructure('Separación excesiva: el techo no alcanzará ambas columnas.');
                  return;
                }
              }

              // Columna asentada correctamente
              activePiece.y = currentBase.y - activePiece.h;
              shake = 4;
              spawnDust(pCenter, currentBase.y, 7);
              tone(96, 0.14, 'sawtooth', 0.05);

              settledBlocks.push({
                x: activePiece.x,
                y: activePiece.y,
                w: activePiece.w,
                h: activePiece.h,
                seed: activePiece.seed
              });

              if (step === 0) {
                curColLeft = { ...activePiece };
                step = 1;
                spawnNextPiece();
              } else {
                // Ordenar izquierda y derecha por si el jugador las cruzó
                if (activePiece.x < curColLeft.x) {
                  curColRight = { ...curColLeft };
                  curColLeft = { ...activePiece };
                } else {
                  curColRight = { ...activePiece };
                }
                step = 2;
                spawnNextPiece();
              }
            }
          }
          // Paso 2: Asentar techo sobre ambas columnas
          else if (step === 2) {
            const topY = Math.min(curColLeft.y, curColRight.y);
            if (activePiece.y + activePiece.h >= topY) {
              const rLeft = activePiece.x;
              const rRight = activePiece.x + activePiece.w;
              const rCenter = activePiece.x + activePiece.w / 2;

              const hitsLeft = rRight > curColLeft.x + 2 && rLeft < curColLeft.x + curColLeft.w - 2;
              const hitsRight = rRight > curColRight.x + 2 && rLeft < curColRight.x + curColRight.w - 2;

              const supL = curColLeft.x + curColLeft.w * 0.25;
              const supR = curColRight.x + curColRight.w * 0.75;

              if (hitsLeft && hitsRight && rCenter >= supL && rCenter <= supR) {
                activePiece.y = topY - activePiece.h;
                shake = 5;
                spawnDust(curColLeft.x + curColLeft.w / 2, topY, 5);
                spawnDust(curColRight.x + curColRight.w / 2, topY, 5);
                tone(84, 0.18, 'sawtooth', 0.055);

                settledBlocks.push({
                  x: activePiece.x,
                  y: activePiece.y,
                  w: activePiece.w,
                  h: activePiece.h,
                  seed: activePiece.seed
                });

                // Este techo pasa a ser la base del siguiente piso
                currentBase = {
                  x: activePiece.x,
                  w: activePiece.w,
                  y: activePiece.y
                };

                if (level > best) {
                  best = level;
                  localStorage.setItem('dolmen_tower_best', String(best));
                }
                updateHUD();

                activePiece = null;
                state = 'SETTLE';
                settleTimer = 42;
                tone(440, 0.07, 'triangle');
                setTimeout(() => tone(660, 0.12, 'triangle'), 80);
                statusText.textContent = `Nivel ${String(level).padStart(2, '0')} estable. Elevando plano de obra...`;
                actionBtn.textContent = 'Subiendo...';
              } else {
                shake = 6;
                failStructure('El techo perdió su centro de gravedad y colapsó.');
              }
            }
          }
        } else if (state === 'SETTLE') {
          settleTimer--;
          if (settleTimer <= 0) {
            startLevel(level + 1);
          }
        } else if (state === 'FAIL' && activePiece) {
          if (activePiece.y < cameraY + H + 30) {
            activePiece.vy += 0.24;
            activePiece.y += activePiece.vy;
            activePiece.x += activePiece.vx;
            activePiece.angle += activePiece.angVel;
          }
        }
      }

      // Bloque megalítico monocromo 1-bit
      function drawMonoStone(x, y, w, h, seed) {
        const ix = Math.round(x);
        const iy = Math.round(y);
        const iw = Math.round(w);
        const ih = Math.round(h);

        ctx.fillStyle = '#000000';
        ctx.fillRect(ix, iy, iw, ih);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(ix + 0.5, iy + 0.5, iw - 1, ih - 1);

        // Bisel interno superior e izquierdo
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ix + 1, iy + 1, iw - 2, 1);
        ctx.fillRect(ix + 1, iy + 1, 1, ih - 2);

        // Trama de granito en 1-bit
        for (let py = 4; py < ih - 3; py += 3) {
          for (let px = 4; px < iw - 3; px += 3) {
            const hash = (px * 7 + py * 13 + seed * 19) % 11;
            if (hash === 0 || hash === 3) {
              ctx.fillRect(ix + px, iy + py, 1, 1);
            }
          }
        }
      }

      function render() {
        ctx.save();
        if (shake > 0) {
          ctx.translate(
            Math.round((Math.random() - 0.5) * 3),
            Math.round((Math.random() - 0.5) * 3)
          );
        }

        // Fondo negro puro
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);

        // Toque mínimo de paisaje fijo en el cielo: astro creciente y estrellitas sutiles
        ctx.fillStyle = '#555555';
        ctx.fillRect(228, 16, 6, 6);
        ctx.fillStyle = '#000000';
        ctx.fillRect(230, 15, 5, 5);

        ctx.fillStyle = '#2e2e2e';
        ctx.fillRect(36, 24, 1, 1);
        ctx.fillRect(114, 18, 1, 1);
        ctx.fillRect(178, 28, 1, 1);

        // Partículas de viento en pantalla
        ctx.fillStyle = wind === 0 ? '#2a2a2a' : '#7a7a7a';
        windParticles.forEach((p) => {
          const len = wind === 0 ? 1 : Math.min(5, Math.ceil(Math.abs(wind) * 70));
          ctx.fillRect(Math.round(p.x), Math.round(p.y), len, 1);
        });

        // Aplicar desplazamiento vertical de cámara para la torre
        ctx.save();
        ctx.translate(0, -Math.round(cameraY));

        // Perfil mínimo de horizonte lejano y línea de tierra
        ctx.fillStyle = '#222222';
        ctx.fillRect(0, groundY - 7, 46, 1);
        ctx.fillRect(46, groundY - 10, 38, 1);
        ctx.fillRect(84, groundY - 6, 62, 1);
        ctx.fillRect(146, groundY - 11, 50, 1);
        ctx.fillRect(196, groundY - 8, 60, 1);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, groundY, W, 1);
        ctx.fillStyle = '#666666';
        for (let tx = 0; tx < W; tx += 5) {
          ctx.fillRect(tx, groundY + 4, 1, 1);
          if (tx % 10 === 0) ctx.fillRect(tx + 2, groundY + 9, 2, 1);
        }

        // Cota sutil sobre la superficie de apoyo actual
        if (level > 1 && state !== 'FAIL') {
          ctx.fillStyle = '#666666';
          ctx.fillRect(Math.round(currentBase.x), Math.round(currentBase.y) - 3, 1, 2);
          ctx.fillRect(Math.round(currentBase.x + currentBase.w - 1), Math.round(currentBase.y) - 3, 1, 2);
        }

        // Plomada de guía durante el balanceo
        if (state === 'SWING' && activePiece) {
          const px = Math.round(activePiece.x + activePiece.w / 2);
          const targetY = step < 2 ? currentBase.y : Math.min(curColLeft.y, curColRight.y);
          ctx.fillStyle = '#555555';
          for (let y = activePiece.y + activePiece.h + 4; y < targetY; y += 4) {
            ctx.fillRect(px, Math.round(y), 1, 2);
          }
        }

        // Todos los bloques ya apilados de la torre
        settledBlocks.forEach((b) => {
          if (b.y + b.h >= cameraY - 20 && b.y <= cameraY + H + 20) {
            drawMonoStone(b.x, b.y, b.w, b.h, b.seed);
          }
        });

        // Pieza activa en movimiento o caída
        if (activePiece) {
          ctx.save();
          const cx = Math.round(activePiece.x + activePiece.w / 2);
          const cy = Math.round(activePiece.y + activePiece.h / 2);
          ctx.translate(cx, cy);
          if (activePiece.angle !== 0) ctx.rotate(activePiece.angle);
          drawMonoStone(-activePiece.w / 2, -activePiece.h / 2, activePiece.w, activePiece.h, activePiece.seed);
          ctx.restore();
        }

        // Partículas de polvo al impactar
        ctx.fillStyle = '#ffffff';
        debris.forEach((d) => {
          ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
        });

        ctx.restore();

        // Cartel limpio de cierre si hay derrumbe
        if (state === 'FAIL') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(28, 56, W - 56, 36);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          ctx.strokeRect(28.5, 56.5, W - 57, 35);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`DERRUMBE EN NIVEL ${String(level).padStart(2, '0')}`, W / 2, 77);
        }

        ctx.restore();
      }

      function loop() {
        update();
        render();
        requestAnimationFrame(loop);
      }

      resetGame();
      loop();
    })();
  </script>
